# ~/.tmux.conf - learnable tmux defaults
# Portable: this single file is all you need. scp it to any remote host.
# Discoverability: press  Ctrl-b Space  for an action menu, Ctrl-b ?  for a cheat sheet.

# ── Sane defaults ────────────────────────────────────────────────────────────
set -g mouse on                 # scroll, click panes, drag borders to resize, select
set -g base-index 1             # windows start at 1 (matches the number-row keys)
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps when you close a window
set -g history-limit 100000     # generous scrollback
set -sg escape-time 10          # snappy ESC (important for vim/nvim)
set -g focus-events on
set -g set-clipboard on         # yank to your LOCAL clipboard via OSC52 — works over SSH too
set -g set-titles on            # keep the terminal window title in sync with tmux

# True color, matching Alacritty/Ghostty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"     # tmux 3.2+
set -ga terminal-overrides ",xterm-256color:Tc"     # fallback for older tmux

# Launch zsh in new panes/windows when available.
if-shell 'command -v zsh >/dev/null 2>&1' 'set -g default-command "exec zsh -l"'

# ── Keybindings (prefix stays Ctrl-b to avoid shell Ctrl-a conflicts) ─────────
# Reload this config
bind -N "Reload config" r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Intuitive splits that keep your current directory
bind -N "Split vertical"   | split-window -h -c "#{pane_current_path}"
bind -N "Split horizontal" - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in the current directory
bind -N "New window" c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (prefix h/j/k/l), plus arrows still work
bind -N "Go left"  h select-pane -L
bind -N "Go down"  j select-pane -D
bind -N "Go up"    k select-pane -U
bind -N "Go right" l select-pane -R

# Resize panes (repeatable: keep pressing H/J/K/L after the prefix)
bind -r -N "Resize left"  H resize-pane -L 5
bind -r -N "Resize down"  J resize-pane -D 5
bind -r -N "Resize up"    K resize-pane -U 5
bind -r -N "Resize right" L resize-pane -R 5

# ── Directional split: Ctrl-b a, then an arrow ────────────────────────────────
bind -N 'Split: pick a direction with an arrow' a switch-client -T split-pane
bind -T split-pane Left   split-window -h -b -c "#{pane_current_path}" \; switch-client -T root
bind -T split-pane Right  split-window -h    -c "#{pane_current_path}" \; switch-client -T root
bind -T split-pane Up     split-window -v -b -c "#{pane_current_path}" \; switch-client -T root
bind -T split-pane Down   split-window -v    -c "#{pane_current_path}" \; switch-client -T root
bind -T split-pane Escape switch-client -T root
bind -T split-pane Any    switch-client -T root \; display-message 'Split cancelled'

# ── Temporary popup shell over the current pane: Ctrl-b P ─────────────────────
bind -N 'Temporary popup shell' P display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# ── Copy mode: vi keys, y to yank ─────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Alerts: pass application bells through; highlight background activity ─────
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
setw -g monitor-activity on
set -g activity-action none
setw -g window-status-activity-style "fg=#f0c674,bold"

# ── Status bar as navigation: click left = browse tree, right = action menu ───
bind -n MouseUp1StatusLeft  choose-tree -Zs
bind -n MouseUp1StatusRight switch-client -T prefix \; send-keys -K Space

# ── The discoverability layer ────────────────────────────────────────────────
# Ctrl-b Space  → popup action menu. Each row shows its shortcut; press it or click.
bind -N "Action menu" Space display-menu -T "#[align=centre fg=#81a2be] tmux " -x C -y C -- \
  "-#[fg=#666666] panes " "" "" \
  "Split │ vertical"    s "split-window -h -c \"#{pane_current_path}\"" \
  "Split — horizontal"  v "split-window -v -c \"#{pane_current_path}\"" \
  "Zoom / unzoom"       z "resize-pane -Z" \
  "Cycle pane"          o "select-pane -t :.+" \
  "Popup shell"         P "display-popup -E -d \"#{pane_current_path}\" -w 80% -h 80%" \
  "Close pane"          x "kill-pane" \
  "" \
  "-#[fg=#666666] windows " "" "" \
  "New window"          c "new-window -c \"#{pane_current_path}\"" \
  "Next window"         n "next-window" \
  "Previous window"     p "previous-window" \
  "Rename window"       , "command-prompt -I \"#W\" \"rename-window -- '%%'\"" \
  "" \
  "-#[fg=#666666] session " "" "" \
  "Detach (keeps running)" d "detach-client" \
  "Switch/list sessions"   w "choose-tree -Zs" \
  "Rename session"         R "command-prompt -I \"#S\" \"rename-session -- '%%'\"" \
  "" \
  "Cheat sheet"         ? "display-popup -w 78 -h 30 -E 'less -R ~/.config/tmux/cheatsheet.txt'" \
  "Reload config"       g "source-file ~/.tmux.conf"

# Ctrl-b ?  → full cheat sheet in a popup (q to close)
bind -N "Cheat sheet" ? display-popup -w 78 -h 30 -E "less -R ~/.config/tmux/cheatsheet.txt"

# ── Status bar with an always-on hint strip ───────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282c34,fg=#c5c8c6"

set -g status-left-length 44
# Mode indicator (PREFIX / SPLIT) then session name. colour220 avoids the
# '#'-in-hex-inside-#{?} parsing trap; static parts keep the hex palette.
set -g status-left "#[fg=colour220,bold]#{?#{==:#{client_key_table},split-pane},SPLIT ←↑↓→ ,#{?client_prefix,PREFIX ,}}#[default]#[bg=#81a2be,fg=#282c34,bold] #{?#{@tmux_resume_base},#{@tmux_resume_base},#{session_name}} #[bg=#282c34,fg=#81a2be]#[default] "

# Window list
setw -g window-status-current-style "bg=#3a3f4b,fg=#f0c674,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#666666"
setw -g window-status-format " #I:#W "

# Hint strip — the commands you use most, always visible while you learn
set -g status-right-length 100
# ZOOM / COPY mode indicators, then the always-on hint strip.
set -g status-right "#[fg=colour220,bold]#{?window_zoomed_flag,ZOOM ,}#{?pane_in_mode,COPY (q exits) ,}#[default]#[fg=#666666]^b #[fg=#8abeb7]Space#[fg=#666666] menu · #[fg=#8abeb7]a#[fg=#666666] split · #[fg=#8abeb7]c#[fg=#666666] win · #[fg=#8abeb7]d#[fg=#666666] detach · #[fg=#8abeb7]?#[fg=#666666] help "

# Pane borders
set -g pane-border-style "fg=#3a3f4b"
set -g pane-active-border-style "fg=#81a2be"

# Copy-mode: release freezes the highlight; copying remains an explicit action.
bind -T copy-mode    MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode    MouseUp1Pane send -X cancel
bind -T copy-mode-vi MouseUp1Pane send -X cancel
bind -T copy-mode    C-c send -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send -X copy-selection-and-cancel

# ── Durable sessions (managed by the optional envy feature) ──────────────
# The bootstrap is a no-op until tmux-persistence is enabled. Keeping the guard
# here preserves this file's standalone portability on hosts without envy.
if-shell '[ -x "$HOME/.local/bin/nv-tmux-bootstrap" ]' \
  'run-shell "$HOME/.local/bin/nv-tmux-bootstrap"'
