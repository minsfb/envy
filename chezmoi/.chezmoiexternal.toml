# chezmoi-managed external repos — zsh plugins cloned into ~/.local/share/envy/zsh
# and sourced by dot_zshrc.tmpl. This is chezmoi's native way to vendor sourced
# shell plugins (mise can't — they have no release binaries for ubi/aqua). Kept
# pinned to reviewed release tags; no TPM/brew needed.
# On hosts without github.com access the clone just fails and dot_zshrc's guarded
# source skips it — no breakage.

[".local/share/envy/zsh/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    clone.args = ["--branch", "v0.7.1", "--depth", "1"]

[".local/share/envy/zsh/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    clone.args = ["--branch", "0.8.0", "--depth", "1"]

[".local/share/envy/zsh/zsh-completions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-completions.git"
    clone.args = ["--branch", "0.36.0", "--depth", "1"]

[".local/share/envy/zsh/zsh-history-substring-search"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-history-substring-search.git"
    clone.args = ["--branch", "v1.1.0", "--depth", "1"]

# JetBrains Mono for the managed Alacritty config lives in
# private_Library/private_Fonts/.chezmoiexternal.toml so the parent
# directories keep macOS's 0700 mode instead of chezmoi's 0755 default.

# Pinned tmux persistence plugins. envy activates them only when the
# tmux-persistence feature marker exists; no runtime plugin manager is needed.
[".local/share/envy/tmux/tmux-resurrect"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-resurrect.git"
    clone.args = ["--branch", "v4.0.0", "--depth", "1"]

[".local/share/envy/tmux/tmux-continuum"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-continuum.git"
    clone.args = ["--branch", "v3.1.0", "--depth", "1"]
