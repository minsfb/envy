# Portable Alacritty defaults managed by envy.

[general]
# Allows optional terminal adapters to create native windows.
ipc_socket = true

[env]
TERM = "xterm-256color"

[window]
padding = { x = 2, y = 2 }
dynamic_padding = false
# Full native macOS title bar — shows the topical title (coding agents set it via
# OSC escape codes) and keeps the buffer clear of the close/min/max buttons.
decorations = "Full"
# Dark title bar and window controls match the terminal background.
decorations_theme_variant = "Dark"
dynamic_title = true
option_as_alt = "None"

[font]
# Install with: brew install --cask font-jetbrains-mono
size = 13.0
normal = { family = "JetBrains Mono", style = "Regular" }
bold   = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }

[bell]
animation = "EaseOutExpo"
duration = 150
color = "#f0c674"
# BEL is the transport across remote shells and tmux. The local helper turns it
# into a macOS notification only while the agent-notifications feature is on.
command = { program = "/bin/sh", args = ["-c", "exec \"$HOME/.local/bin/nv-terminal-notify\""] }

# ── Colors ───────────────────────────────────────────────────────────────────
[colors.primary]
background = "#282c34"
foreground = "#ffffff"

[colors.normal]
black   = "#1d1f21"
red     = "#cc6666"
green   = "#b5bd68"
yellow  = "#f0c674"
blue    = "#81a2be"
magenta = "#b294bb"
cyan    = "#8abeb7"
white   = "#c5c8c6"

[colors.bright]
black   = "#666666"
red     = "#d54e53"
green   = "#b9ca4a"
yellow  = "#e7c547"
blue    = "#7aa6da"
magenta = "#c397d8"
cyan    = "#70c0b1"
white   = "#eaeaea"
